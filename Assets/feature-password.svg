<svg viewBox="0 0 1240 740" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1240" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F3EC"/>
      <stop offset="1" stop-color="#EFE7D8"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#3A2A1A" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="40"/></filter>
    <style>.m{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}</style>
  </defs>

  <rect width="1240" height="740" rx="30" fill="url(#bg)"/>
  <circle cx="1110" cy="110" r="150" fill="#FF6B57" opacity="0.10" filter="url(#soft)"/>
  <circle cx="130" cy="650" r="165" fill="#FFFCF6" opacity="0.7" filter="url(#soft)"/>

  <!-- ===== Clipboard panel showing the locked 密码 category ===== -->
  <g filter="url(#card)"><rect x="70" y="72" width="640" height="600" rx="24" fill="#FCFAF5"/></g>

  <!-- search field stays put: the gate replaces only the list area -->
  <rect x="102" y="104" width="576" height="52" rx="14" fill="#EEE8DC"/>
  <circle cx="134" cy="130" r="9" fill="none" stroke="#9A9CA3" stroke-width="2.2"/>
  <line x1="141" y1="137" x2="149" y2="145" stroke="#9A9CA3" stroke-width="2.2" stroke-linecap="round"/>
  <text x="162" y="137" font-size="19" fill="#A7A9B0">搜索剪贴板</text>

  <!-- category chips, 密码 selected -->
  <g font-size="17" font-weight="500">
    <rect x="102" y="178" width="78" height="42" rx="21" fill="#EEE8DC"/>
    <text x="141" y="205" fill="#5B5E66" text-anchor="middle">文本</text>
    <rect x="192" y="178" width="78" height="42" rx="21" fill="#EEE8DC"/>
    <text x="231" y="205" fill="#5B5E66" text-anchor="middle">代码</text>
    <rect x="282" y="178" width="78" height="42" rx="21" fill="#EEE8DC"/>
    <text x="321" y="205" fill="#5B5E66" text-anchor="middle">链接</text>
    <rect x="372" y="178" width="78" height="42" rx="21" fill="#EEE8DC"/>
    <text x="411" y="205" fill="#5B5E66" text-anchor="middle">截图</text>
    <rect x="462" y="178" width="78" height="42" rx="21" fill="#FF6B57"/>
    <text x="501" y="205" fill="#FFFFFF" text-anchor="middle">密码</text>
  </g>

  <!-- the gate: nothing about the hidden entries is drawn, not even a count -->
  <g transform="translate(390,330)">
    <path d="M-19 4 L19 4 L19 34 L-19 34 Z" rx="6" fill="#7A7D85"/>
    <rect x="-19" y="4" width="38" height="30" rx="6" fill="#7A7D85"/>
    <path d="M-11 4 L-11 -8 a11 11 0 0 1 22 0 L11 4" fill="none" stroke="#7A7D85" stroke-width="7"/>
  </g>
  <text x="390" y="424" font-size="22" font-weight="700" fill="#24262B" text-anchor="middle">「密码」已锁定</text>
  <text x="390" y="456" font-size="16" fill="#8C8F97" text-anchor="middle">输入 PIN 码以查看此分类</text>

  <!-- four-dot PIN entry -->
  <g>
    <circle cx="330" cy="506" r="11" fill="#24262B"/>
    <circle cx="370" cy="506" r="11" fill="#24262B"/>
    <circle cx="410" cy="506" r="11" fill="#24262B"/>
    <circle cx="450" cy="506" r="11" fill="none" stroke="#B6B2A8" stroke-width="2"/>
  </g>

  <!-- Touch ID -->
  <g transform="translate(336,548)">
    <g stroke="#FF6B57" stroke-width="1.8" fill="none" stroke-linecap="round">
      <!-- concentric ridges, widest outermost -->
      <path d="M1 15 A 13 13 0 0 1 27 15"/>
      <path d="M5 18 A 9 9 0 0 1 23 18"/>
      <path d="M9 20 A 5 5 0 0 1 19 20"/>
      <path d="M14 20 L14 26"/>
      <path d="M5 18 L5 25"/>
      <path d="M23 18 L23 25"/>
    </g>
    <text x="44" y="24" font-size="17" font-weight="500" fill="#FF6B57">使用触控 ID</text>
  </g>

  <!-- ===== Right column: what it protects and how it is configured ===== -->

  <!-- encrypted at rest -->
  <g filter="url(#card)"><rect x="748" y="72" width="422" height="196" rx="20" fill="#FCFAF5"/></g>
  <g transform="translate(786,112)">
    <rect x="-6" y="-6" width="34" height="34" rx="9" fill="#FFEDE8"/>
    <g stroke="#FF6B57" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="2" y="9" width="18" height="13" rx="3"/>
      <path d="M6 9 V5 a5 5 0 0 1 10 0 v4"/>
    </g>
  </g>
  <text x="838" y="126" font-size="18" font-weight="600" fill="#24262B">加密保存</text>
  <text x="786" y="168" font-size="15" fill="#5B5E66">密码正文以 AES-GCM 加密后才写入磁盘，</text>
  <text x="786" y="194" font-size="15" fill="#5B5E66">密钥存于钥匙串，仅在复制那一刻解密。</text>
  <rect x="786" y="216" width="346" height="32" rx="8" fill="#F2EDE3"/>
  <text x="800" y="238" class="m" font-size="13" fill="#8C8F97">hmenc.v1:kR7d9Qm2…</text>

  <!--列表中始终遮罩 -->
  <g filter="url(#card)"><rect x="748" y="292" width="422" height="150" rx="20" fill="#FCFAF5"/></g>
  <text x="786" y="332" font-size="18" font-weight="600" fill="#24262B">列表中不显示原文</text>
  <rect x="786" y="352" width="346" height="40" rx="10" fill="#F4F0E8"/>
  <g transform="translate(806,365)" stroke="#9A9CA3" stroke-width="1.8" fill="none" stroke-linecap="round">
    <rect x="0" y="6" width="13" height="9" rx="2.5"/>
    <path d="M3 6 V3.5 a3.5 3.5 0 0 1 7 0 V6"/>
  </g>
  <text x="836" y="378" font-size="15" fill="#8C8F97">已隐藏的密码</text>
  <text x="786" y="420" font-size="14" fill="#8C8F97">搜索与预览同样看不到内容</text>

  <!-- 可选锁定范围 -->
  <g filter="url(#card)"><rect x="748" y="466" width="422" height="206" rx="20" fill="#FCFAF5"/></g>
  <text x="786" y="506" font-size="18" font-weight="600" fill="#24262B">可选锁定范围</text>
  <g font-size="13">
    <rect x="786" y="524" width="64" height="26" rx="13" fill="#E9E3D6"/>
    <text x="818" y="542" fill="#5B5E66" text-anchor="middle">文本</text>
    <rect x="858" y="524" width="64" height="26" rx="13" fill="#E9E3D6"/>
    <text x="890" y="542" fill="#5B5E66" text-anchor="middle">代码</text>
    <rect x="930" y="524" width="64" height="26" rx="13" fill="#E9E3D6"/>
    <text x="962" y="542" fill="#5B5E66" text-anchor="middle">截图</text>
    <rect x="1002" y="524" width="64" height="26" rx="13" fill="#FF6B57"/>
    <text x="1034" y="542" fill="#FFFFFF" font-weight="600" text-anchor="middle">密码</text>
    <rect x="786" y="560" width="118" height="26" rx="13" fill="#E9E3D6"/>
    <text x="845" y="578" fill="#5B5E66" text-anchor="middle">表情包面板</text>
  </g>
  <line x1="786" y1="606" x2="1132" y2="606" stroke="#EFE9DD" stroke-width="1.5"/>
  <text x="786" y="636" font-size="15" fill="#5B5E66">锁定时机</text>
  <text x="1132" y="636" font-size="15" fill="#24262B" text-anchor="end">当电脑锁定后</text>
  <text x="786" y="660" font-size="13" fill="#A7A9B0">也可选未用 5 / 15 / 30 分钟后</text>
</svg>
